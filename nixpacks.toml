[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["if [ \"$EASYFLOW_PROCESS\" = \"worker\" ]; then npm run db:generate; else npm run build; fi"]

[start]
cmd = "if [ \"$EASYFLOW_PROCESS\" = \"worker\" ]; then exec npm run worker; else exec npm run start; fi"
port = 80
